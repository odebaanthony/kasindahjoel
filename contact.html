<section class="contact" style="min-height:70vh"><div class="wrap grid2" style="grid-template-columns:1fr 1.1fr"><div><h1 style="font-size:clamp(2rem,4vw,3rem)">Talk to a lawyer</h1><p>Tell us briefly what you need. We will reply within one working day to arrange a consultation at either office or by phone.</p><p><strong>Kampala:</strong> [Plot and street], Kampala<br><a href="tel:+256700000000">+256 700 000 000</a></p><p><strong>Iganga:</strong> [Street], Iganga Town<br><a href="tel:+256700000001">+256 700 000 001</a></p><p><a href="mailto:info@kasindhalaw.example">info@kasindhalaw.example</a></p></div><div><form id="f" novalidate><label>Full name<input id="n" autocomplete="name"><span class="err" id="en"></span></label><label>Phone or email<input id="c"><span class="err" id="ec"></span></label><label>Preferred office<select id="of"><option>Kampala</option><option>Iganga</option><option>Phone call</option></select></label><label>Matter type<select id="m"><option>Land and property</option><option>Family and succession</option><option>Commercial and corporate</option><option>Civil litigation</option><option>Criminal defence</option><option>Employment and labour</option><option>Banking and recovery</option><option>Other</option></select></label><label>How can we help?<textarea id="t"></textarea><span class="err" id="et"></span></label><button class="btn" type="submit">Send request</button><div class="ok" id="ok" role="status"></div></form></div></div></section>
